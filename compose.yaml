services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      PORT: "8000"
      GREETING: "${GREETING:-Hello from Docker Compose!}"
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    mem_limit: 256m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http:' + chr(47)*2 + '127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
